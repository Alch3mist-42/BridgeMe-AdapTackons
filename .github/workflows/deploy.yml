name: Deploy to Azure App Service
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency: deploy-production
jobs:
  deploy:
    # Skips until role D sets the AZURE_WEBAPP_NAME variable (so early pushes aren't red)
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ob/db generate
        env: { DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci" }
      - run: pnpm test
      - run: pnpm build
      # Next.js standalone output: copy static assets next to the server
      - name: Assemble bundle
        run: |
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          if [ -d apps/web/public ]; then cp -r apps/web/public apps/web/.next/standalone/apps/web/public; fi
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: apps/web/.next/standalone
